apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-model
  labels:
    app: chess-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chess-model
  template:
    metadata:
      labels:
        app: chess-model
    spec:
      containers:
        - name: chess-model
          image: ethancruz/chess_model:v1.0.18
          env:
            - name: modelType
              value: "ChessEvalCNN"
          ports:
            - containerPort: 6006  # Expose TensorBoard
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /app/logs  # Ensure log directory exists
              python train_model.py --logdir /app/logs &  # Start training in the background
              tensorboard --logdir /app/logs --host 0.0.0.0 --port 6006  # Start TensorBoard
---
apiVersion: v1
kind: Service
metadata:
  name: chess-model-service
spec:
  selector:
    app: chess-model
  ports:
    - protocol: TCP
      port: 6006
      targetPort: 6006
  type: NodePort  # Use LoadBalancer if deploying to cloud
