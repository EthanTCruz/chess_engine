---
apiVersion: v1
kind: Service
metadata:
  name: pytorch-service
spec:
  selector:
    app: chess-engine-1
  type: NodePort
  ports:
    - name: jupyter
      port: 8888       # Service port
      targetPort: 8888 # Container port in the Deployment
      protocol: TCP
      nodePort: 30088   # Optional; if omitted, K8s will assign a random NodePort
    - name: tensroboard
      port: 5000
      targetPort: 5000
      protocol: TCP
      nodePort: 30050    # Optional; if omitted, K8s will assign a random NodePort
